plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "pkg/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 30
  Exclude:
    - "test/**/*"

Metrics/ClassLength:
  Max: 300
  Exclude:
    - "test/**/*"

Metrics/AbcSize:
  Max: 40
  Exclude:
    - "test/**/*"

Metrics/CyclomaticComplexity:
  Max: 12
  Exclude:
    - "test/**/*"

Metrics/PerceivedComplexity:
  Max: 12
  Exclude:
    - "test/**/*"

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "*.gemspec"
    - "Rakefile"

Minitest/MultipleAssertions:
  Max: 12
